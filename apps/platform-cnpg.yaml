# CloudNativePG operator + Barman Cloud plugin (WAL archiving / backups to S3). Retries until cert-manager's webhook is up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cnpg
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  source:
    repoURL: https://github.com/mierai-lab/gitops-manifests.git
    targetRevision: main
    path: platform/cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
