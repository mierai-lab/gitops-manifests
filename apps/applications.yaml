# Every application registered by an app.yaml (<app>/app.yaml, e.g. storefront/app.yaml): one Argo CD Application
# per component × environment, named <component>-<env>, deployed into the namespace <name>-<env>.
#   component kustomize: <dir>  → path <app>/<dir>/<env>
#   component helm: <dir>       → chart <app>/<dir>/chart, values <app>/<dir>/values-<env>.yaml
# The namespace gets the labels the platform keys on: admission policies (enforced), the GHCR pull secret (cloned by
# platform/policies/ghcr-pull.yaml), image signatures (when signedImages). ignoreDifferences (app.yaml) is passed
# through, with RespectIgnoreDifferences. scripts/render.py renders the same way for validate.sh / diff.sh: keep both
# in step.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - git:
                    repoURL: https://github.com/mierai-lab/gitops-manifests.git
                    revision: main
                    files: [{ path: "*/app.yaml" }]
                # prefixed keys: the app, the component and the environment all have a name
                - list:
                    elementsYaml: |
                      {{- range .components }}
                      - component: {{ toJson . }}
                      {{- end }}
          - list:
              elementsYaml: |
                {{- range .environments }}
                - env: {{ toJson . }}
                {{- end }}
  syncPolicy:
    preserveResourcesOnDeletion: true   # removing an app.yaml removes its Applications, not (yet) its workloads
  template:
    metadata:
      name: "{{ .component.name }}-{{ .env.name }}"
      namespace: argocd
      labels: { gitops-platform/app: "{{ .name }}", gitops-platform/env: "{{ .env.name }}" }
    spec:
      project: default
      source:
        repoURL: https://github.com/mierai-lab/gitops-manifests.git
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}-{{ .env.name }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
        retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
  templatePatch: |
    spec:
      source:
      {{- if hasKey .component "helm" }}
        path: "{{ .path.path }}/{{ .component.helm }}/chart"
        helm:
          releaseName: "{{ .component.name }}"
          valueFiles: ["../values-{{ .env.name }}.yaml"]
      {{- else }}
        path: "{{ .path.path }}/{{ .component.kustomize }}/{{ .env.name }}"
      {{- end }}
      {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences: {{ toJson .ignoreDifferences }}
      {{- end }}
      syncPolicy:
        {{- if hasKey . "ignoreDifferences" }}
        syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
        {{- end }}
        managedNamespaceMetadata:
          labels:
            gitops-platform/policies: enforced
            gitops-platform/ghcr-pull: "true"
            {{- if and (hasKey . "signedImages") .signedImages }}
            gitops-platform/image-signatures: required
            {{- end }}
