apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-argo-rollouts
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }   # platform add-ons before the apps that use them
spec:
  project: default
  source:
    repoURL: https://github.com/mierai-lab/gitops-manifests.git
    targetRevision: main
    path: platform/argo-rollouts
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
