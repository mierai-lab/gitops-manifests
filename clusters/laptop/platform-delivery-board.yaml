# laptop only: where every api-factory change is, from design PR to prod (http://<laptop>:30090)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-delivery-board
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mierai-lab/gitops-manifests.git
    targetRevision: main
    path: platform/delivery-board
  destination:
    server: https://kubernetes.default.svc
    namespace: delivery-board      # created by infrastructure-live (holds the GitHub token)
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
