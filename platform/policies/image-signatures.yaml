# Images from public app repos must carry a cosign keyless signature made by the shared build workflow on main
# (gitops-platform-blueprint build-image.yml, sign: true). Private repos (api-factory) are not signed: signing would
# publish the repository name in the public transparency log.
# Scope: namespaces labelled gitops-platform/image-signatures=required (app.yaml signedImages: true → the
# ApplicationSet sets it; older apps set it in their Application), every image of ours (ghcr.io/mierai/*) there.
# failurePolicy stays Fail (default): if the signature cannot be checked (Sigstore / registry unreachable), new
# Pods are rejected. Running Pods are not affected.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata: { name: verify-image-signatures }
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector: { matchLabels: { gitops-platform/image-signatures: required } }
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods] }
  matchImageReferences:   # tag and digest references (a digest-only reference must not bypass the check)
    - glob: "ghcr.io/mierai/*:*"
    - glob: "ghcr.io/mierai/*@*"
    - glob: "ghcr.io/mierai-lab/*:*"
    - glob: "ghcr.io/mierai-lab/*@*"
  validationConfigurations:
    required: true
    mutateDigest: false   # keep the Pod spec as in Git (Argo CD diff)
    verifyDigest: false   # tags are commits; the digest is checked through the signature
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - subject: https://github.com/MIERAI/gitops-platform-blueprint/.github/workflows/build-image.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
  validations:
    - expression: images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
      message: "image is not signed by the shared build workflow (gitops-platform-blueprint build-image.yml on main)"
