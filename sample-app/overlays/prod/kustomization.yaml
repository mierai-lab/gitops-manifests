apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app-prod
resources: [../../base]
replicas:
  - name: sample-app
    count: 2
patches:
  - target: { kind: Service, name: sample-app }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30083
images:
  - name: ghcr.io/mierai/sample-app
    newName: ghcr.io/mierai-lab/sample-app
    newTag: "fce142d"
